<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦИА — диагностика и проектирование акустического комфорта</title>
  <meta name="description" content="Центр инновационной акустики: исследуем акустическое поведение помещений, подбираем формат работы и проектируем решения под задачу.">
  <link rel="canonical" href="/qr/">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var key = 'cia-theme';
      var theme = 'dark';
      try {
        var stored = localStorage.getItem(key);
        if (stored === 'light' || stored === 'dark') theme = stored;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { /* ignore */ }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css?v=qr1">
  <style>
    .qr-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }
    .qr-card {
      width: min(100%, 28rem);
      padding: var(--space-2xl);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-xl);
      background: var(--color-surface);
      box-shadow: var(--shadow-glass);
      text-align: center;
    }
    .qr-card__brand {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      font-weight: 700;
      margin: 0 0 var(--space-md);
      letter-spacing: -0.02em;
    }
    .qr-card__brand span {
      color: var(--color-accent-light);
    }
    .qr-card__lead {
      margin: 0 0 var(--space-xl);
      color: var(--color-text-secondary);
      font-size: var(--text-base);
      line-height: 1.55;
    }
    .qr-card__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }
    .qr-card__actions .btn {
      width: 100%;
      justify-content: center;
    }
    .qr-card__contacts {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .qr-card__contacts a {
      color: var(--color-accent-light);
    }
  </style>
</head>
<body>
  <main class="qr-page" id="main">
    <div class="qr-card">
      <p class="qr-card__brand">ЦИА <span>/</span> Помещения</p>
      <p class="qr-card__lead">Диагностика и проектирование акустического комфорта помещений — от первичного разбора до проекта и проверки результата.</p>
      <div class="qr-card__actions">
        <a href="../#lead" class="btn btn--primary">Оставить заявку на разбор проблемы <span class="btn__arrow" aria-hidden="true">→</span></a>
        <a href="../#diagnose" class="btn btn--secondary">Подобрать формат работы</a>
      </div>
      <div class="qr-card__contacts" id="qr-contacts">
        <a href="#" data-contact="phone"></a>
        <a href="#" data-contact="email"></a>
        <a href="#" data-contact="telegram"></a>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/seo.js"></script>
</body>
</html>
